# Project-wide Gradle settings.
# Kotlin integrado en AGP 9 (sustituye al plugin org.jetbrains.kotlin.android).
android.builtInKotlin=true
android.defaults.buildfeatures.resvalues=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.uniquePackageNames=false
android.useAndroidX=true

# AGP 9.4 sugiere android.dependency.excludeLibraryComponentsFromConstraints, pero esa
# opción ya está deprecada en 9.4 (default actual: false) y añadirla cambia un warning
# por otro. Este proyecto es de un solo módulo, así que el aviso no aplica: se silencia.
android.sync.suppressAgpWarnings=LIBRARY_CONSTRAINTS_SHOULD_BE_DISABLED,UNSUPPORTED_PROJECT_OPTION_USE

# Rendimiento del build
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
